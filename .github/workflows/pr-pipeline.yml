name: Backend PR Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  node-checks:
    name: Lint, Build e Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/testdb?schema=public
      JWT_SECRET: ${{ secrets.AUTH_TOKEN }} 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci 

      - name: Gerar Prisma Client
        run: npx prisma generate
        
      - name: Rodar Migrations do Banco de Dados
        run: npx prisma migrate deploy

      - name: Check de Lint
        run: npm run lint

      - name: Check de Build (Typecheck)
        run: npm run build

      - name: Check de Testes
        run: npm run test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

  docker-checks:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Check de Docker Compose
        run: docker compose build
name: Backend PR Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  node-checks:
    name: Lint, Build e Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci 

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Check de Lint
        run: npm run lint

      - name: Check de Build (Typecheck)
        run: npm run build

      - name: Check de Testes
        run: npm run test

  docker-checks:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Check de Docker Compose
        run: docker compose build